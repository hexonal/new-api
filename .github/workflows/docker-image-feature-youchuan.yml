name: Publish Docker image (feature/youchuan-pixverse-kling-o1)

on:
  push:
    branches:
      - feature/youchuan-pixverse-kling-o1
      - feature/infras-hexonal-youchuan-pixverse-kling-o1
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BRANCH_TAG: feature-youchuan-pixverse-kling-o1

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute image version
        run: |
          VERSION="${BRANCH_TAG}-$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build & push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifest:
    name: Create multi-arch manifest
    needs: build_single_arch
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute image version
        run: |
          VERSION="${BRANCH_TAG}-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push branch manifest
        run: |
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:${BRANCH_TAG} \
            ${IMAGE_NAME}:${BRANCH_TAG}-amd64 \
            ${IMAGE_NAME}:${BRANCH_TAG}-arm64

      - name: Create & push latest manifest
        run: |
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:latest-amd64 \
            ${IMAGE_NAME}:latest-arm64

      - name: Create & push version manifest
        run: |
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:${VERSION} \
            ${IMAGE_NAME}:${VERSION}-amd64 \
            ${IMAGE_NAME}:${VERSION}-arm64

      - name: Upsert rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.BRANCH_TAG }}
          RELEASE_TITLE: feature/youchuan-pixverse-kling-o1
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          自动发布于: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          分支: ${GITHUB_REF_NAME}
          提交: ${GITHUB_SHA}

          镜像:
          - ${IMAGE_NAME}:latest
          - ${IMAGE_NAME}:${BRANCH_TAG}
          - ${IMAGE_NAME}:${VERSION}
          EOF
          )

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "${NOTES}" \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes "${NOTES}" \
              --prerelease
          fi

      - name: Cleanup stale branch package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          CURRENT_VERSION: ${{ env.VERSION }}
          BRANCH_TAG: ${{ env.BRANCH_TAG }}
        run: |
          set -euo pipefail

          if gh api "/orgs/${OWNER}" >/dev/null 2>&1; then
            BASE="/orgs/${OWNER}"
          else
            BASE="/users/${OWNER}"
          fi

          KEEP_TAGS_JSON=$(jq -n \
            --arg latest "latest" \
            --arg latest_amd64 "latest-amd64" \
            --arg latest_arm64 "latest-arm64" \
            --arg branch "${BRANCH_TAG}" \
            --arg branch_amd64 "${BRANCH_TAG}-amd64" \
            --arg branch_arm64 "${BRANCH_TAG}-arm64" \
            --arg current "${CURRENT_VERSION}" \
            --arg current_amd64 "${CURRENT_VERSION}-amd64" \
            --arg current_arm64 "${CURRENT_VERSION}-arm64" \
            '[$latest,$latest_amd64,$latest_arm64,$branch,$branch_amd64,$branch_arm64,$current,$current_amd64,$current_arm64]')

          page=1
          while true; do
            versions=$(gh api "${BASE}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${page}")
            count=$(echo "${versions}" | jq 'length')
            if [ "${count}" -eq 0 ]; then
              break
            fi

            ids=$(echo "${versions}" | jq -r \
              --arg branch "${BRANCH_TAG}" \
              --argjson keep "${KEEP_TAGS_JSON}" '
              .[]
              | {id, tags: (.metadata.container.tags // [])}
              | select((.tags | length) > 0)
              | select(any(.tags[]; startswith($branch)))
              | select(all(.tags[]; ($keep | index(.) | not)))
              | .id
            ')

            if [ -n "${ids}" ]; then
              while IFS= read -r id; do
                [ -z "${id}" ] && continue
                gh api -X DELETE "${BASE}/packages/container/${PACKAGE_NAME}/versions/${id}" || true
              done <<< "${ids}"
            fi

            page=$((page + 1))
          done
