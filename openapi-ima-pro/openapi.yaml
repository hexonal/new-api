        model:
          type: string
          enum:
          - kling-v1
          - kling-v1-6
          - kling-v2-master
          - kling-v2-1-master
          - kling-v2-5-turbo
          - kling-v2-6
          - kling-video-o1
          description: Kling 视频模型名称。
        prompt:
          type: string
          description: 视频描述提示词。文生视频时必填；图生视频时可选。
        image:
          type: string
          description: 图生视频参考图片 URL。单图图生视频推荐使用该字段；请自行保证输入 URL 在提交时可访问。
        images:
          type: array
          items:
            type: string
          description: 图生视频参考图片 URL 数组。需要多图输入时使用；Kling 首尾帧更推荐将尾帧放入 `metadata.image_tail`。请自行保证输入 URL 在提交时可访问。
        duration:
          type: integer
          enum:
          - 5
