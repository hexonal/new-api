    ConsumeCallbackEvent:
      type: object
      required:
      - request_id
      - user_id
      - username
      - token_id
      - token_name
      - sk
      - model_name
      - channel_id
      - billing_source
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - quota
      - amount_usd
      - timestamp
      - event_phase
      properties:
        request_id:
          type: string
          description: '网关请求 ID（可用于与使用日志对账）。

            当调用方请求头携带 `X-Trace-Id` 时，此字段与 `X-Trace-Id` 保持一致。

            '
        user_id:
          type: integer
          description: 用户 ID（兼容字段，建议优先使用 username）
          deprecated: true
        username:
          type: string
          description: 用户名（推荐使用）
        token_id:
          type: integer
          description: Token ID（兼容字段，建议优先使用 sk）
          deprecated: true
        token_name:
          type: string
          description: Token 名称
        sk:
          type: string
          description: 调用本次请求的 SK（带 sk- 前缀）
        model_name:
          type: string
          description: 实际请求模型名
        channel_id:
          type: integer
          description: 实际命中的渠道 ID
        billing_source:
          type: string
          enum:
          - wallet
          - subscription
          description: 扣费来源（钱包/订阅）
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        quota:
          type: integer
          minimum: 0
          description: 本次扣减 quota（new-api 内部计费单位）
        amount_usd:
          type: number
          format: double
          minimum: 0
          description: 本次扣费折算美元金额
        timestamp:
          type: integer
          format: int64
          description: 事件生成时间（Unix 秒）
        event_phase:
          type: string
          enum:
          - settle
          description: '事件阶段，当前仅发送 `settle`。

            '
