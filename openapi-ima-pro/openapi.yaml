  /mj/submit/imagine:
    post:
      tags:
      - Midjourney
      summary: MJ 提交绘图任务
      description: '提交 Midjourney 绘图任务（MJ Proxy 协议）。

        鉴权：请求头必须包含 `Authorization: Bearer sk-...`。


        可用模型：`mj_imagine`（由渠道路由自动选择，无需在请求体传 model）。


        所有 MJ 参数（模型版本、速度模式、画质等）通过 prompt 尾部 `--` 语法传递，

        详见 Midjourney tag 说明中的"支持的 Prompt 参数（Settings）"。

        '
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - name: x-youchuan-setting
        in: header
        required: false
        schema:
          type: string
        example: '3'
        description: '悠船上游扩展开关（可选，透传到上游）。

          若你已在请求头中传入该值，服务端不会覆盖。

          具体取值语义请以悠船上游文档/支持确认为准。

          '
      operationId: submitMidjourneyImagine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - prompt
              properties:
                prompt:
                  type: string
                  description: 'MJ 提示词（支持参数后缀）。

                    常用参数：

                    - 模型版本：`--v 6` / `--v 6.1` / `--v 7` / `--niji 6` / `--niji 7`

                    - 风格化：`--stylize` / `--s`

                    - 怪异化：`--weird` / `--w`

                    - 多样化（混沌）：`--chaos` / `--c`

                    - 其他：`--ar` / `--q` / `--seed` / `--raw` / `--no` / `--stop` / `--tile` / `--cref` / `--sref` / `--iw`

                    '
            examples:
              basic:
                summary: 基础绘图
                value:
                  prompt: a cute cat watercolor style --ar 16:9
              with_settings:
                summary: 带速度和模型设置
                value:
                  prompt: futuristic city --v 7 --fast --ar 16:9 --s 200 --q 2
              v61_profile:
                summary: 指定 V6.1
                value:
                  prompt: cinematic landscape --v 6.1 --ar 16:9
              niji7_profile:
                summary: 指定 Niji 7
                value:
                  prompt: anime style girl in rain --niji 7 --ar 9:16
              image_reference:
                summary: 图生图（图片引用）
                value:
                  prompt: https://example.com/photo.jpg a beautiful landscape --iw 1.5
              style_reference:
                summary: 风格参考
                value:
                  prompt: a portrait --sref https://example.com/style.jpg --sw 500 --v 7
              settings_case_001_header_only:
                summary: SET-001 仅 x-youchuan-setting（请求头）
                description: 'Header 传 `x-youchuan-setting: 3`，prompt 不携带版本参数。

                  '
                value:
                  prompt: settings-case header only city skyline
              settings_case_002_header_and_prompt_v:
                summary: SET-002 Header + prompt 显式 --v
                description: 'Header 传 `x-youchuan-setting: 3`，prompt 显式 `--v 6.1`，按用户 prompt 透传。

                  '
                value:
                  prompt: settings-case header + prompt --v 6.1 --ar 1:1
              settings_case_003_prompt_niji_only:
                summary: SET-003 仅 prompt 显式 --niji
                value:
                  prompt: settings-case prompt only --niji 7 --ar 1:1
      responses:
        '200':
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MjSubmitResponse'
              examples:
                success:
                  value:
                    code: 1
                    result: task_id_123
                    description: submitted
      x-apifox-folder: Midjourney
  /mj/submit/blend:
    post:
      tags:
      - Midjourney
      summary: MJ 融图（Blend）
      description: '上传 2-5 张图片进行融合生成，返回任务 ID（异步）。

        鉴权：请求头必须包含 `Authorization: Bearer sk-...`。

        **重要提示（必读）**

        - `base64Array` 当前按图片 URL 输入处理，请在调用前确认 URL 可访问，并建议自行持久化原图。

        - 生成结果 URL 为平台托管短期链接，默认约 30 天后失效；请务必在 30 天内完成下载归档。

        '
      operationId: submitMidjourneyBlend
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - base64Array
              properties:
                base64Array:
                  type: array
                  minItems: 2
                  maxItems: 5
                  description: '2-5 张图片 URL 数组（当前实现按 URL 输入处理）。

                    **重要提示**：请在调用前确认输入 URL 可访问；30 天失效规则仅适用于接口返回的结果资源 URL。

                    '
                  items:
                    type: string
                prompt:
                  type: string
                  description: 可选，附加文字描述。
            examples:
              blend_two_images:
                summary: 两图融合
                value:
                  base64Array:
                  - https://example.com/a.png
                  - https://example.com/b.png
              blend_two_images_with_prompt:
                summary: 两图融合+文字
                value:
                  base64Array:
                  - https://example.com/a.png
                  - https://example.com/b.png
                  prompt: cinematic style
      responses:
        '200':
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MjSubmitResponse'
              examples:
                success:
                  value:
                    code: 1
                    result: task_id_blend_123
                    description: submitted
      x-apifox-folder: Midjourney
  /mj/submit/change:
    post:
      tags:
      - Midjourney
      summary: MJ 变换操作（放大/变体/扩图/延展/重绘/重塑等）
      description: '对已完成的 MJ 任务执行变换操作。

        鉴权：请求头必须包含 `Authorization: Bearer sk-...`。


        可用操作：

        - `UPSCALE` — 放大（Subtle 默认，customId 含 "creative" 则为 Creative）

        - `VARIATION` — 变体（Strong 默认）

        - `LOW_VARIATION` — 细微变体（Vary Subtle）

        - `HIGH_VARIATION` — 大幅变体（Vary Strong）

        - `REROLL` — 重新生成（仅需 taskId，无需 index）

        - `ZOOM` — 扩图 Zoom Out（scale 从 customId 解析：outpaint::50=2x, outpaint::75=1.5x）

        - `CUSTOM_ZOOM` — 自定义扩图（scale 从 prompt 中 `--zoom 1.3` 解析）

        - `PAN` — 延展（方向从 customId 解析：pan_left/pan_right/pan_up/pan_down）

        - `REMIX` — 重塑（需 prompt）


        > 注：当前悠船上游对局部重绘能力返回限制错误，平台已下线 `mj_inpaint`。


        也可通过 `/mj/submit/action` 端点用 customId 格式触发（MJ Proxy Plus 协议）。

        '
      operationId: submitMidjourneyChange
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - taskId
              properties:
                action:
                  type: string
                  enum:
                  - UPSCALE
                  - VARIATION
                  - LOW_VARIATION
                  - HIGH_VARIATION
                  - REROLL
                  - ZOOM
                  - CUSTOM_ZOOM
                  - PAN
                  - REMIX
                  description: 操作类型。
                taskId:
                  type: string
                  description: 原始任务 ID（即上次任务返回的 result）。
                index:
                  type: integer
                  minimum: 1
                  maximum: 4
                  description: 图片序号（1-4），REROLL 不需要。
                prompt:
                  type: string
                  description: 新提示词（REMIX 必填，CUSTOM_ZOOM/ZOOM/PAN/INPAINT 可选作为 remixPrompt）。
                maskBase64:
                  type: string
                  description: INPAINT 必填，PNG 二值图 base64（白色=重绘区域）。
                customId:
                  type: string
                  description: '可选。用于解析特定动作语义（例如 `pan_right`、`outpaint::75`、`upscale::creative`）。

                    '
            examples:
              upscale_subtle:
                summary: 标准高清放大第 1 张
                value:
                  action: UPSCALE
                  taskId: task_id_123
                  index: 1
              vary_subtle:
                summary: 细微变体第 2 张
                value:
                  action: LOW_VARIATION
                  taskId: task_id_123
                  index: 2
              vary_strong:
                summary: 大幅变体第 3 张
                value:
                  action: HIGH_VARIATION
                  taskId: task_id_123
                  index: 3
              reroll:
                summary: 重新生成
                value:
                  action: REROLL
                  taskId: task_id_123
              zoom_2x:
                summary: Zoom Out 2x
                value:
                  action: ZOOM
                  taskId: task_id_123
                  index: 1
              pan_right:
                summary: 向右延展
                value:
                  action: PAN
                  taskId: task_id_123
                  index: 1
                  customId: pan_right
              zoom_custom:
                summary: 自定义扩图（CUSTOM_ZOOM）
                value:
                  action: CUSTOM_ZOOM
                  taskId: task_id_123
                  index: 1
                  prompt: --zoom 1.4 add flowers
              remix:
                summary: 重塑（REMIX）
                value:
                  action: REMIX
                  taskId: task_id_123
                  index: 1
                  prompt: watercolor style
      responses:
        '200':
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MjSubmitResponse'
              examples:
                success:
                  value:
                    code: 1
                    result: task_id_456
                    description: submitted
      x-apifox-folder: Midjourney
