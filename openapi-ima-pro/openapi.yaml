components:
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      example: Bearer sk-xxxxxxxxxxxxxxxx
      description: 访问令牌，格式固定为 `Bearer sk-...`。
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk-xxxx
      description: '将 SK 放在请求头：

        `Authorization: Bearer sk-xxxx`

        '
  schemas:
    AssetGroupCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 64
          description: 分组名称（用户侧展示名）。
          example: marketing-assets
        description:
          type: string
          maxLength: 300
          description: 分组描述（可选）。
          example: 素材分组-市场投放
        group_type:
          type: string
          default: AIGC
          description: 分组类型。当前默认使用 `AIGC`。
          example: AIGC
        project_name:
          type: string
          default: default
          description: 项目命名空间。未传时默认 `default`。
          example: default
        model:
          type: string
          enum:
          - ima-pro-upload
          - ima-pro-upload-cn
          - seedance-upload
          description: '可选，资产模型名。严重提醒：务必显式传 `model` 区分国内与海外人像协议，避免素材协议与视频模型渠道不匹配。

            - `ima-pro-upload`：国内人像（默认，历史兼容）

            - `ima-pro-upload-cn`：国内人像，适配 `seedance-2.0-cn`、`seedance-2.0-fast-cn`

            - `seedance-upload`：海外人像，适配 `seedance-2.0`、`seedance-2.0-fast`

            - 不要混用国内/海外素材协议；否则 `asset://...` 后续用于视频任务时可能调用失败。

            '
          example: ima-pro-upload-cn
    AssetGroupListRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            name:
              type: string
            group_ids:
              type: array
              items:
                type: string
            group_type:
              type: string
              default: AIGC
              description: 分组类型过滤，通常为 `AIGC`。
        page_number:
          type: integer
          minimum: 1
          default: 1
          description: 页码（从 1 开始）。
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 每页数量（1-100）。
        sort_by:
          type: string
          enum:
          - CreateTime
          - UpdateTime
          description: 排序字段（严格区分大小写）。
        sort_order:
          type: string
          enum:
          - Asc
          - Desc
          description: 排序方向（严格区分大小写）。
        project_name:
          type: string
          default: default
          description: 项目命名空间。未传按默认项目处理。
        model:
          type: string
          enum:
          - ima-pro-upload
          - ima-pro-upload-cn
          - seedance-upload
          description: '可选，资产模型名。严重提醒：务必显式传 `model` 区分国内与海外人像协议，避免素材协议与视频模型渠道不匹配。

            - `ima-pro-upload`：国内人像（默认，历史兼容）

            - `ima-pro-upload-cn`：国内人像，适配 `seedance-2.0-cn`、`seedance-2.0-fast-cn`

            - `seedance-upload`：海外人像，适配 `seedance-2.0`、`seedance-2.0-fast`

            - 不要混用国内/海外素材协议；否则 `asset://...` 后续用于视频任务时可能调用失败。

            '
          example: ima-pro-upload-cn
    AssetCreateRequest:
      type: object
      required:
      - group_id
      - url
      properties:
        group_id:
          type: string
          description: 分组 ID（可用 `/v1/assets/group/list` 获取）。
          example: grp_123456
        url:
          type: string
          format: uri
          description: 公开可访问的素材 URL。调用前请确认可访问，并建议自行持久化原始素材；30 天失效规则仅适用于接口返回的结果资源 URL。
          example: https://example.com/image.png
        name:
          type: string
          maxLength: 64
          description: 素材名称（可选）。
          example: cover-image
        asset_type:
          type: string
          default: Image
          enum:
          - Image
          - Video
          - Audio
          description: '素材类型，默认 `Image`。

            当 `asset_type=Audio` 时，音频时长必须在 `1.8s` 到 `15.2s` 之间（闭区间），否则返回 `InvalidParameter.DurationTooLong`。'
          example: Image
        project_name:
          type: string
          default: default
          description: 项目命名空间。未传时默认 `default`。
          example: default
        billing_token_id:
          type: integer
          description: '可选，指定本次上传扣费使用的 token id。

            不传时：默认使用当前请求头 `Authorization` 对应 SK 的 token。

            约束：必须属于当前用户、状态为启用、并且余额足够。

            '
          example: 3
        model:
          type: string
          enum:
          - ima-pro-upload
          - ima-pro-upload-cn
          - seedance-upload
          description: '可选，资产模型名。计费时优先使用该模型价格；未传时默认 `ima-pro-upload`。

            **严重提醒**：创建人像素材/素材协议时，务必显式传 `model` 区分国内与海外渠道，避免素材协议与视频模型渠道不匹配。

            - `ima-pro-upload`：国内人像（默认，历史兼容）

            - `ima-pro-upload-cn`：国内人像，适配 `seedance-2.0-cn`、`seedance-2.0-fast-cn`

            - `seedance-upload`：海外人像，适配 `seedance-2.0`、`seedance-2.0-fast`

            - 不要混用国内/海外素材协议；否则 `asset://...` 后续用于视频任务时可能调用失败。

            '
          example: ima-pro-upload-cn
    AssetListRequest:
      type: object
      properties:
        filters:
          type: object
