openapi: 3.0.3
info:
  title: New API - IMA Pro（OpenAI 兼容）
  version: 1.5.14
  description: "IMA Pro 对外接口文档（严格对齐 New API 当前实现）。\n\n版本更新（1.5.14）：\n- `/v1/videos` 新增 Seedance 模型支持（同 Ima-Pro 端点）：\n  - `seedance-2.0`\n  - `seedance-2.0-fast`\n  - `seedance-2.0-cn`\n  - `seedance-2.0-fast-cn`\n\
    - Asset 上传模型补充海外模型说明：\n  - `seedance-upload`（海外）\n\n版本更新（1.5.13）：\n- Asset 接口请求体新增 `model` 字段（支持按模型做权限/渠道映射）：\n  - `/v1/assets/group/create`\n  - `/v1/assets/group/list`\n  - `/v1/assets/create`\n \
    \ - `/v1/assets/list`\n- 明确计费行为：\n  - 仅 `/v1/assets/create` 会触发扣费\n  - 扣费模型与请求体 `model` 一致（未传时默认 `ima-pro-upload`）\n\n版本更新（1.5.12）：\n- 新增“音乐版权风险规避”反例示例（C14）：\n  - 建议先禁用背景音乐（`metadata.audio=false`），避免潜在版权争议\n\
    \  - 提示词约束“无字幕、无背景音乐，仅保留剧情人声/环境音效/动作音效”\n\n版本更新（1.5.11）：\n- 补充 `asset://` 素材协议示例（包含人像参考图场景）：\n  - `POST /v1/videos` 请求示例新增“文本 + 图片(公网 URL + asset://) + 视频 + 音频”案例\n  - 明确 `images` / `input_reference`\
    \ 均支持 `asset://asset-xxxx` 与 `https://` URL\n\n版本更新（1.5.10）：\n- 明确 `/v1/videos` 仅用于视频任务：\n  - 仅支持：`ima-pro`、`ima-pro-fast`\n  - 图片模型（如 `gemini-3-pro-image-preview`、`gemini-3.1-flash-image-preview`）不支持该端点\n\
    - 补充图片模型误用 `/v1/videos` 的 400 错误示例（`invalid_model_endpoint`）\n\n版本更新（1.5.9）：\n- 新增 Asset 对外端点文档：\n  - `/v1/assets/group/create|list|get|update`\n  - `/v1/assets/create|list|get|update|delete|quota`\n\
    - 明确 Asset 排序参数为严格枚举：\n  - `sort_by`: `CreateTime|UpdateTime|GroupId`（资产列表）\n  - `sort_by`: `CreateTime|UpdateTime`（分组列表）\n  - `sort_order`: `Asc|Desc`\n- 明确计费行为：仅 `/v1/assets/create` 会触发 Asset 上传扣费。\n\
    \n版本更新（1.5.8）：\n- 补充 `/settings` 参数语义验证案例（无独立 `/settings` 端点）：\n  - `SET-001`：仅 `x-youchuan-setting`\n  - `SET-002`：`x-youchuan-setting` + prompt 中显式 `--v`\n  - `SET-003`：仅 prompt 中显式 `--niji`\n- 补充\
    \ `/mj/submit/change` 高级动作示例：`REROLL`、`ZOOM`、`CUSTOM_ZOOM`、`PAN`、`INPAINT`、`REMIX`\n\n版本更新（1.5.3）：\n- 补充 Midjourney 公开接口文档（`/mj/submit/imagine`、`/mj/submit/change`、`/mj/task/{task_id}/fetch`、`/mj/image/{task_id}`）\n\
    - 保持 IMA OpenAI 兼容视频接口优先展示（`/v1/videos`、`/v1/videos/{task_id}`）\n- 明确 MJ 与 IMA 共用同一 SK 鉴权头（`Authorization: Bearer sk-...`）\n\n版本更新（1.5.4）：\n- `duration` 从枚举值调整为区间约束：`4-15` 秒（避免误导）\n- `seconds` 同步调整为字符串区间约束（`\"\
    4\"` ~ `\"15\"`）\n\n版本更新（1.5.5）：\n- 补充 `x-youchuan-setting` 可选请求头说明（MJ 提交接口）\n- 明确“用户手动参数优先”规则：用户已写 `--v/--niji` 或已传 `x-youchuan-setting` 时，服务端不覆盖\n\n版本更新（1.5.6）：\n- 补充 Midjourney 参数别名说明：`--stylize/--s`、`--chaos/--c`、`--weird/--w`\n\
    - 明确“多样化”对应混沌参数（`--chaos` / `--c`）\n\n版本更新（1.5.7）：\n- 将 Midjourney 参数能力前置到 `prompt` 字段描述，确保在端点参数详情页直接可见\n\n版本更新（1.5.2）：\n- 完成 OpenAI 兼容接口对齐更新（模型/渠道迁移后统一对外以 `/v1/videos` 与 `/v1/videos/{task_id}` 为准）\n\
    - 补充 OpenAI 风格调用说明，明确请求头需传 `Authorization: Bearer sk-...`\n\n版本更新（1.5.1）：\n- 明确 OpenAI 兼容接口的 SK 鉴权传递方式（`Authorization: Bearer sk-...`）\n- 统一图片角色参数为 `metadata.role_mode`（`reference` / `frame`）\n- 补充\
    \ 401 鉴权错误示例（未提供 token / token 不可用）\n\n对外公开端点：\n1. `POST /v1/videos`：创建异步视频任务\n2. `GET /v1/videos/{task_id}`：查询任务状态与结果\n3. `POST /mj/submit/imagine`：MJ 绘图提交\n4. `POST /mj/submit/blend`：MJ 融图提交\n5. `POST\
    \ /mj/submit/change`：MJ 放大/变体\n6. `GET /mj/task/{task_id}/fetch`：MJ 任务查询\n7. `GET /mj/image/{task_id}`：MJ 首图代理\n\n重要说明：\n- 鉴权方式（必填）：`Authorization: Bearer sk-xxxx`\n- 示例：\n  - `Authorization: Bearer\
    \ sk-xxxxxxxxxxxxxxxx`\n- 这是 New API 对外 OpenAI 风格接口，不是上游 `/api/v1/aigc/task/create` 原生接口。\n- IMA Pro 不对外暴露 `callback_url`，请通过轮询查询任务结果。\n- 兼容别名渠道说明：`ima-pro`、`ima-pro-fast` 为**海外渠道**历史别名（保留向后兼容）。\n- 内部租户与应用字段由服务端侧处理，不作为对外参数。\n- `user_id` 由服务端自动注入为当前调用 SK，不对外暴露。\n\
    - `prompt` 规则：仅“文本”组合必填；其余 6 种组合为可选。\n- 图片角色映射规则（服务端行为）：\n  - 默认（`metadata.role_mode` 不传或 `reference`）：单图与多图均映射 `reference_image`\n  - 显式 `metadata.role_mode=frame`：启用首尾帧语义（单图=first_frame；双图=first_frame+last_frame）\n\
    \  - `frame` 模式不能与 `reference_video_urls`/`reference_audio_urls` 混用\n- Midjourney `/settings` 说明：\n  - 不提供独立 `/settings` API。\n  - 通过 prompt 参数与请求头 `x-youchuan-setting` 表达设置语义。\n- 下述“组合逻辑”基于 New API\
    \ 当前对外行为编写。\n"
servers:
- url: https://open-route.fashionlabs.cn/
- url: https://api.imarouter.com/
tags:
- name: IMA-Pro 视频
- name: MiniMax 视频
- name: Kling 视频
- name: PixVerse 视频
- name: Vidu 视频
- name: Gemini Image
- name: Midjourney
- name: 人像
- name: Chat
- name: Video
security:
- BearerAuth: []
paths:
  /v1/images/generations:
    post:
      tags:
      - Gemini Image
      summary: 生成图片
      description: "OpenAI Images 兼容端点（当前按异步任务提交）。\n\n当前支持模型：\n- `gemini-3-pro-image-preview`\n- `gemini-3.1-flash-image-preview`\n- 不支持 `gemini-3-pro-preview`（text_to_text）\n\n参数说明（按上游 `gemini-3` 参数原名对齐）：\n\
        - `prompt`：必填\n- `aspect_ratio`：可选\n- `size`：可选\n- `image` / `images`：可选（用于 image-to-image）\n- `image_to_image` 输入数量：`1~14`\n- `image_to_image` 文件类型：`jpg/png`\n- 参数处理规则（重要）：\n  - 图片模型请求仅使用上游图片参数：`prompt`、`image/images`、`aspect_ratio`、`size`\n\
        \  - 不执行 `size -> resolution` 映射\n  - 不自动补 `duration`\n  - 不注入视频参数 `resolution`\n- 返回值中的 `id/task_id` 为任务 ID，需再调用 `GET /v1/images/generations/{task_id}` 轮询获取结果。\n\n**重要提示（必读）**\n- 30 天失效规则仅适用于接口返回的图片结果 URL，不代表输入的 `image` / `images` 会被平台主动过期。\n- 图片接口返回的结果 URL 为平台托管短期链接，建议客户端在接收后立即下载保存，默认约 30 天后失效。\n"
      operationId: createImageGenerationTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImaImageGenerationRequest'
            examples:
              gemini3_pro_text_to_image:
                summary: gemini-3-pro-image-preview 文生图
                value:
                  model: gemini-3-pro-image-preview
                  prompt: a futuristic city at sunset
                  aspect_ratio: '16:9'
                  size: 2K
              gemini3_pro_single_image_to_image:
                summary: gemini-3-pro-image-preview 单图生图（image）
                value:
                  model: gemini-3-pro-image-preview
                  prompt: convert to cinematic film still style
                  image: https://example.com/source.jpg
                  aspect_ratio: '4:3'
                  size: 1K
              gemini3_pro_multi_image_to_image:
                summary: gemini-3-pro-image-preview 多图生图（images）
                value:
                  model: gemini-3-pro-image-preview
                  prompt: blend these references into one product poster
                  images:
                  - https://example.com/ref-1.jpg
                  - https://example.com/ref-2.png
                  aspect_ratio: '3:2'
                  size: 4K
              gemini31_flash_image_to_image:
                summary: gemini-3.1-flash-image-preview 图生图
                value:
                  model: gemini-3.1-flash-image-preview
                  prompt: turn this into watercolor style
                  images:
                  - https://example.com/input.jpg
                  aspect_ratio: '1:1'
                  size: 1K
              gemini31_flash_text_to_image_512:
                summary: gemini-3.1-flash-image-preview 文生图（512px）
                value:
                  model: gemini-3.1-flash-image-preview
                  prompt: minimalist icon set for weather app
                  aspect_ratio: '1:1'
                  size: 512px
      responses:
        '200':
          description: 提交成功（异步任务）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImaImageCreateTaskResponse'
              examples:
                task_submitted:
                  summary: 返回任务 ID（需继续轮询）
                  value:
                    id: task_202603200001
                    task_id: task_202603200001
                    object: image
                    model: gemini-3.1-flash-image-preview
                    status: queued
                    progress: 0
                    created_at: 1774000000
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskErrorResponse'
        '401':
          description: 鉴权失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-apifox-folder: Gemini Image
  /v1/images/generations/{task_id}:
    get:
      tags:
      - Gemini Image
      summary: 查询图片任务状态与结果
      description: '查询 `POST /v1/images/generations` 提交后的异步任务。

        **严重告知（必读）**

        - 30 天失效规则仅适用于接口返回的图片结果 URL，不代表输入的 `image` / `images` 会被平台主动过期。

        - 查询成功后如返回图片结果 URL，请立即下载并自行持久化保存；平台不保证结果 URL 长期可访问，默认约 30 天后失效。

        '
      operationId: fetchImageGenerationTask
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
        description: 提交创建接口返回的任务 ID。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImaImageTaskFetchResponse'
              examples:
                pending:
                  summary: 处理中
                  value:
                    code: success
                    data:
                      task_id: task_202603200001
                      status: processing
                      format: png
                      url: ''
                      usage:
                        input_tokens: 9
                        output_tokens: 0
                        total_tokens: 9
                      error: null
                      metadata: null
                success:
                  summary: 成功
                  value:
                    code: success
                    data:
                      task_id: task_202603200001
                      status: succeeded
                      format: png
                      url: https://cdn.example.com/gen/abc123.png
                      usage:
                        input_tokens: 9
                        output_tokens: 1505
                        total_tokens: 1514
                      error: null
                      metadata: null
                failed:
                  summary: 失败
                  value:
                    code: success
                    data:
                      task_id: task_202603200001
                      status: failed
                      format: png
                      url: ''
                      usage:
                        input_tokens: 9
                        output_tokens: 0
                        total_tokens: 9
                      error:
                        message: upstream task failed
                      metadata: null
        '400':
          description: 参数错误（如 task_id 不存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskErrorResponse'
        '401':
          description: 鉴权失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-apifox-folder: Gemini Image
  /v1/videos:
    post:
      tags:
      - IMA-Pro 视频
      summary: 创建异步视频任务（Seedance）
      description: '使用 Seedance 模型提交视频任务：

        - `seedance-2.0`

        - `seedance-2.0-fast`

        - `seedance-2.0-cn`

        - `seedance-2.0-fast-cn`

        - ~~`ima-pro`~~（海外渠道历史别名，已过期；向后兼容，请改用 `seedance-2.0` / `seedance-2.0-cn`）

        - ~~`ima-pro-fast`~~（海外渠道历史别名，已过期；向后兼容，请改用 `seedance-2.0-fast` / `seedance-2.0-fast-cn`）

        鉴权：请求头必须包含 `Authorization: Bearer sk-...`。

        端点约束：`/v1/videos` 为视频任务端点，不支持图片模型（例如 `gemini-3-pro-image-preview`、`gemini-3.1-flash-image-preview`）。

        **重要提示（必读）**

        - `images`、`metadata.reference_video_urls`、`metadata.reference_audio_urls`、`metadata.first_frame_image` 等输入 URL（含公网 URL 或 `asset://...`）是任务输入引用，请在提交时确认可访问。

        常用字段：

        - 文本：`prompt`

        - 图片：`images`（支持多图）

        - 参考视频：`metadata.reference_video_urls`

        - 参考音频：`metadata.reference_audio_urls`

        - 音频开关：`metadata.audio`（版权风险场景建议先置为 `false`，即无背景音乐）


        **重要说明：按生成方式选择示例**

        - 文生视频（仅文本生成）：参考 `C01 文本（ima-pro-fast）`、`C01b 文本 1080p（ima-pro）`。

        - 图生视频（图片驱动生成）：参考 `C02 文本+图片(1图)`、`C03 单图默认参考图`、`C04 单图显式首帧`、`C05 两图默认参考图`、`C06 两图显式首尾帧`。

        - 参考生视频（参考视频/音频/人像协议参与生成）：参考 `C07 文本+视频`、`C08 文本+图片+音频`、`C09 文本+图片+视频`、`C10 文本+视频+音频`、`C11 文本+图片+视频+音频`、`C12 文本+人像+视频+音频`、`C15 文本+视频人像协议`、`C16 文本+图片+音频人像协议`。

        - 反例与规避策略：参考 `C13 参考视频像素不足（601300）`、`C14 音乐版权风险场景（先禁背景音乐）`。


        组合逻辑（对齐 New API 当前行为）：

        - 文本（`prompt` 必填）

        - 文本 + 图片（`prompt` 可选）

        - 文本 + 视频（`prompt` 可选）

        - 文本 + 图片 + 音频（`prompt` 可选）

        - 文本 + 图片 + 视频（`prompt` 可选）

        - 文本 + 视频 + 音频（`prompt` 可选）

        - 文本 + 图片 + 视频 + 音频（`prompt` 可选）


        图片角色映射（重要）：

        - 默认模式（`role_mode=reference`）：图片统一映射为 `reference_image`

        - 帧模式（`role_mode=frame`）：单图映射 `first_frame`，双图映射 `first_frame + last_frame`

        - 帧模式不能与 `reference_video_urls`/`reference_audio_urls` 同时使用


        人物素材合规说明：

        - 使用自有虚拟人物或真人素材时，仅限素人，不支持明星人物。

        - 平台会对上传素材进行审核，以规避可能的法律风险。

        - 已支持通过 `/v1/assets/create` 上传人物素材（创建素材）并进入审核流程。

        - 建议流程：先调用 `/v1/assets/create` 上传并沉淀素材，再在 `/v1/videos` 请求中引用已审核素材。

        - 上传后可调用 `/v1/assets/get` 轮询素材状态，一般 10s 内即可获取结果。

        - 文档示例支持点击复制；复制后的请求体可直接交给 AI 自动识别并生成最终接入代码。

        - 如需批量接入素材，请优先走素材库接口而非临时直链。


        下方示例是请求体，不是返回体。

        '
      operationId: createImaProVideoTask
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer sk-xxxxxxxxxxxxxxxx
        description: '鉴权请求头，格式：`Bearer sk-...`。

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImaProVideoCreateRequest'
            examples:
              C01_text_fast:
                summary: C01 文本（ima-pro-fast）
                description: '`ima-pro-fast` 文生视频显式分辨率示例。实测 `metadata.resolution=1080p`
                  会被上游返回 `Invalid parameters`，文生视频建议使用 `720p` 或 `480p`。'
                value:
                  model: ima-pro-fast
                  prompt: 清晨城市延时摄影，暖色调，电影感。
                  duration: 5
                  metadata:
                    resolution: 720p
              C01b_text_pro_1080p:
                summary: C01b 文本 1080p（ima-pro）
                description: '`ima-pro` 文生视频显式 1080p 分辨率示例。实测创建成功并进入 `in_progress`。'
                value:
                  model: ima-pro
                  prompt: 清晨城市延时摄影，暖色调，电影感。
                  duration: 5
                  metadata:
                    resolution: 1080p
              C02_text_image_pro:
                summary: C02 文本+图片(1图)（ima-pro）
                value:
                  model: ima-pro
                  prompt: C02 单图基础示例（1图）
                  images:
                  - https://file.fashionlabs.cn/doc_image/r2v_tea_pic1.jpg
                  duration: 10
                  metadata:
                    aspect_ratio: '16:9'
                    audio: true
                    role_mode: reference
              C03_single_image_ref_pro:
                summary: C03 单图默认参考图（ima-pro）
                description: 未传 `role_mode`，按默认 `reference_image` 处理。
                value:
                  model: ima-pro
                  prompt: C03 单图默认参考图（1图）
                  images:
                  - https://file.fashionlabs.cn/doc_image/r2v_tea_pic1.jpg
                  duration: 5
                  metadata:
                    aspect_ratio: '9:16'
                    role_mode: reference
              C04_single_image_ref_fast:
                summary: C04 单图显式首帧（ima-pro-fast）
                description: '`role_mode=frame`，单图按 `first_frame` 处理。'
                value:
                  model: ima-pro-fast
                  prompt: C04 单图显式首帧（1图，fast）
                  images:
                  - https://file.fashionlabs.cn/doc_image/r2v_tea_pic1.jpg
                  duration: 10
                  metadata:
                    role_mode: frame
                    aspect_ratio: '21:9'
              C05_two_images_ref_pro:
                summary: C05 两图默认参考图（ima-pro）
                description: '未传 `role_mode`，两图按 `reference_image + reference_image` 处理。

                  '
                value:
                  model: ima-pro
                  prompt: C05 两图默认参考图（2图）
                  images:
                  - https://dev-jiman.oss-cn-hangzhou.aliyuncs.com/jm/20260316/ac5fe9ec6640426bafd6200b254b4b5f.png
