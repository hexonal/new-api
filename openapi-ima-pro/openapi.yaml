  /v1/chat/completions:
    post:
      tags:
      - Chat
      summary: 创建对话补全
      description: '兼容 OpenAI Chat Completions API 格式。支持流式和非流式响应。


        **可用模型（43 个）：**


        | 供应商 | 模型 |

        |--------|------|

        | OpenAI | `gpt-4.1`, `gpt-4.1-mini`, `gpt-4.1-nano`, `gpt-4o`, `gpt-4o-mini`, `gpt-5`, `gpt-5-mini`, `gpt-5.1`, `gpt-5.2`, `gpt-5.3-codex` |

        | Google | `gemini-3.1-pro-preview`, `gemini-3-pro-preview`, `gemini-3-flash-preview`, `gemini-3-pro-image-preview`⚡, `gemini-2.5-pro`, `gemini-2.5-flash`, `gemini-2.5-flash-lite`, `gemini-2.5-flash-image`⚡,
        `gemini-2.0-flash`, `g3-pro-image-preview`⚡, `g2.5-flash-image`⚡ |

        | Anthropic | `claude-3-haiku-20240307`, `claude-3-5-haiku-20241022`, `claude-sonnet-4-20250514`, `claude-sonnet-4-5-20250929`, `claude-sonnet-4-6`, `claude-haiku-4-5-20251001`, `claude-opus-4-1-20250805`,
        `claude-opus-4-5-20251101`, `claude-opus-4-6` |

        | 字节跳动 | `seed-1-8-251228`, `seed-2-0-mini-260215`, `seed-1-6-flash-250715`, `seed-1-6-250915`, `gpt-oss-120b-250805` |

        | MiniMax | `MiniMax-Text-01`, `MiniMax-M1`, `MiniMax-M2`, `MiniMax-M2.1`, `MiniMax-M2.1-highspeed`, `MiniMax-M2.5`, `MiniMax-M2.5-highspeed` |

        | Moonshot | `kimi-for-coding` |


        **模型端点能力（2026-03-04 已验证）：**

        | 端点标识 | 网关路径 | 当前可用模型 |

        |---------|---------|-------------|

        | `openai` | `/v1/chat/completions` | Chat 模型通用 |

        | `openai-response` | `/v1/responses` | `gpt-5.2`, `gpt-5.3-codex` |

        | `anthropic` | `/v1/messages` | `claude-sonnet-4-6`, `claude-opus-4-6` |


        > ⚡ 带 ⚡ 标记的模型支持对话式生图，返回内联 base64 图片。MiniMax M 系列、`kimi-for-coding` 为推理模型，响应包含思维链内容。Anthropic Claude 系列通过 AWS Bedrock 接入。


        > ⚠️ **推理模型注意事项**：MiniMax M 系列（`MiniMax-M2` 至 `MiniMax-M2.5-highspeed`）和 `kimi-for-coding` 在生成正式回答前会先输出思维链（`reasoning_content` 字段），思维链本身会消耗大量 token。**建议 `max_tokens` 设置不低于 1000**，否则 token 配额可能在推理阶段耗尽，导致
        `content` 为空。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              basic:
                summary: 基础对话
                value:
                  model: gpt-4.1-mini
                  messages:
                  - role: user
                    content: Hello, how are you?
              stream:
                summary: 流式对话
                value:
                  model: gemini-2.5-flash
                  messages:
                  - role: user
                    content: Write a short poem about AI
                  stream: true
              image_gen:
                summary: Gemini 对话式生图
                value:
                  model: gemini-3-pro-image-preview
                  messages:
                  - role: user
                    content: Generate a cute cat watercolor painting, output as image
              image_gen_lite:
                summary: 轻量级对话式生图
                value:
                  model: g2.5-flash-image
                  messages:
                  - role: user
                    content: Draw a minimalist logo for a coffee shop
              claude:
                summary: Claude 对话
                value:
                  model: claude-sonnet-4-6
                  messages:
                  - role: user
                    content: Hello, what can you help me with?
              minimax_reasoning:
                summary: MiniMax 推理模型
                value:
                  model: MiniMax-M2.5
                  messages:
                  - role: user
                    content: Explain the difference between recursion and iteration
                  max_tokens: 2000
              function_tools:
                summary: Function Tools（OpenAI 格式）
                value:
                  model: gemini-3.1-pro-preview
                  messages:
                  - role: user
                    content: What's weather in Shanghai? Use tool.
                  tools:
                  - type: function
                    function:
                      name: get_weather
                      description: Get weather by city
                      parameters:
                        type: object
                        properties:
                          city:
                            type: string
                        required:
                        - city
                  tool_choice: auto
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
      x-apifox-folder: Chat
      x-apifox-status: released
