                  model: kling-v2-5-turbo
                  prompt: Smooth transition between two scenes
                  image: https://example.com/first_frame.jpg
                  duration: 5
                  size: '16:9'
                  metadata:
                    mode: pro
                    image_tail: https://example.com/last_frame.jpg
      responses:
        '200':
          description: 任务提交成功
          content:
