  /v1/video/generations:
    post:
      tags:
      - MiniMax 视频
      summary: 提交视频生成任务
      description: "MiniMax 视频生成（异步任务制）。提交后返回 `task_id`，通过 `GET /v1/video/generations/{task_id}` 轮询结果。\n\n\
        **提交端点：** `POST /v1/video/generations`\n\n\
        **支持模型：**\n\
        - `MiniMax-Hailuo-02`\n\
        - `MiniMax-Hailuo-2.3`\n\
        - `MiniMax-Hailuo-2.3-Fast`\n\n\
        **约束：**\n\
        - `MiniMax-Hailuo-2.3-Fast` 仅图生视频，必须传 `metadata.first_frame_image`\n\
        - `duration` 仅支持 `6` 或 `10`\n\
        - `MiniMax-Hailuo-02` 支持：\n\
          - `512p`: `6/10s`\n\
          - `768p`: `6/10s`\n\
          - `1080p`: `仅 6s`\n\
        - `MiniMax-Hailuo-2.3` 支持：\n\
          - `768p`: `6/10s`\n\
          - `1080p`: `仅 6s`\n\
        - `MiniMax-Hailuo-2.3-Fast` 支持：\n\
          - `768p`: `6/10s`\n\
          - `1080p`: `仅 6s`\n\
          - 且必须传 `metadata.first_frame_image`\n\n\
        **重要提示（必读）**\n\
        - `metadata.first_frame_image` 等输入 URL 是任务输入引用，请在提交时确认可访问。\n\n\
        **调用示例：**\n\
        ```bash\n\
        curl -X POST https://open-route.fashionlabs.cn/v1/video/generations \\\n\
        \  -H \"Authorization: Bearer sk-xxxx\" \\\n\
        \  -H \"Content-Type: application/json\" \\\n\
        \  -d '{\"model\":\"MiniMax-Hailuo-2.3\",\"prompt\":\"A cat playing\",\"duration\":6,\"size\":\"1080p\"}'\n\
        ```\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniMaxVideoGenerationRequest'
            examples:
              hailuo_02_text2video:
                summary: MiniMax-Hailuo-02 文生视频
                value:
                  model: MiniMax-Hailuo-02
                  prompt: A cat playing with a ball of yarn
              text2video:
                summary: MiniMax 文生视频
                value:
                  model: MiniMax-Hailuo-2.3
                  prompt: A cat playing with a ball of yarn
              hailuo_img2video:
                summary: 图生视频（Hailuo） ⚠️ metadata 传参
                value:
                  model: MiniMax-Hailuo-2.3
                  prompt: A person slowly walking forward
                  metadata:
                    first_frame_image: https://example.com/photo.jpeg
              hailuo_fast_img2video:
                summary: 图生视频（Hailuo-2.3-Fast） ⚠️ 仅图生视频
                value:
                  model: MiniMax-Hailuo-2.3-Fast
                  prompt: A person slowly walking forward
                  size: 1080p
                  metadata:
                    first_frame_image: https://example.com/photo.jpeg
      responses:
        '200':
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTaskResponse'
              examples:
                submitted:
                  value:
                    id: task_abc123
                    task_id: task_abc123
                    object: video
                    model: MiniMax-Hailuo-2.3
                    status: ''
                    progress: 0
                    created_at: 1772037755
        '400':
          description: 参数错误（例如模型能力或分辨率不匹配）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                hailuo_fast_text2video_rejected:
                  summary: Hailuo-2.3-Fast 纯文本被拒绝（仅支持图生视频）
                  value:
                    code: '500'
                    message: 'hailuo api error: model MiniMax-Hailuo-2.3-Fast does not support Text-to-Video mode'
                    data: null
                hailuo_fast_invalid_resolution:
                  summary: Hailuo-2.3-Fast 使用 720p 被拒绝
                  value:
                    code: '2013'
                    message: 'hailuo api error: invalid params, model MiniMax-Hailuo-2.3-Fast does not support resolution 720P, supported resolutions: 768P, 1080P'
                    data: null
      x-apifox-folder: MiniMax 视频
      x-apifox-status: released
