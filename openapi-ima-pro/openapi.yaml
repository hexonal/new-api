    ImaProVideoCreateRequest:
      type: object
      required:
      - model
      additionalProperties: false
      description: '7 种输入组合（与服务端行为一致）：

        1. 文本（`prompt` 必填）

        2. 文本 + 图片（`images`，`prompt` 可选）

        3. 文本 + 视频（`metadata.reference_video_urls`，`prompt` 可选）

        4. 文本 + 图片 + 音频（`images` + `metadata.reference_audio_urls`，`prompt` 可选）

        5. 文本 + 图片 + 视频（`images` + `metadata.reference_video_urls`，`prompt` 可选）

        6. 文本 + 视频 + 音频（`metadata.reference_video_urls` + `metadata.reference_audio_urls`，`prompt` 可选）

        7. 文本 + 图片 + 视频 + 音频（`images` + `metadata.reference_video_urls` + `metadata.reference_audio_urls`，`prompt` 可选）

        图片语义补充：

        - 单图与多图均按 `reference_image` 语义处理，不自动推断 `first_frame` / `last_frame`。

        '
      properties:
        model:
          type: string
          enum:
          - seedance-2.0
          - seedance-2.0-fast
          - seedance-2.0-cn
          - seedance-2.0-fast-cn
          - ima-pro
          - ima-pro-fast
          description: '目标模型。

            - `seedance-2.0`：Seedance 标准版（海外）

            - `seedance-2.0-fast`：Seedance 极速版（海外）

            - `seedance-2.0-cn`：Seedance 标准版（国内）

            - `seedance-2.0-fast-cn`：Seedance 极速版（国内）

            - ~~`ima-pro`~~（海外渠道历史别名，已过期；向后兼容，请改用 seedance-2.0 / seedance-2.0-cn）

            - ~~`ima-pro-fast`~~（海外渠道历史别名，已过期；向后兼容，请改用 seedance-2.0-fast / seedance-2.0-fast-cn）

            '
        prompt:
          type: string
          minLength: 1
          description: '主提示词。仅“文本”组合必填；其余 6 种组合可选。

            支持中英文；建议中文不超过 500 字，英文不超过 1000 词。

            '
        images:
          type: array
          description: '图片 URL 数组（支持多图）。

            **重要提示**：上传前请确保 URL 在调用时可访问；30 天失效规则仅适用于接口返回的结果资源 URL。

            支持两类 URL：

            - 公网可访问 URL（`https://...`）

            - 素材库协议 URL（`asset://asset-...`）

            传入单张图片要求：

            - 格式：`jpeg`、`png`、`webp`、`bmp`、`tiff`、`gif`

            - 宽高比（宽/高）：`(0.4,2.5)`

            - 宽高长度（px）：`(300,6000)`

            - 单张图片大小：`<30MB`

            - 请求体总大小：`<=64MB`

            - 大文件请勿使用 Base64 编码，建议使用可访问 URL。

            '
          items:
            type: string
            format: uri
        input_reference:
          type: string
          format: uri
          description: '兜底图片 URL（仅在未传 `images` 时生效）。

            **重要提示**：该链接用于任务提交，请在提交前确认可访问；30 天失效规则仅适用于接口返回的结果资源 URL，输出资源建议接收后及时持久化。

            支持 `https://...` 与 `asset://asset-...`。

            图片输入约束与 `images` 单张图片要求一致。

            '
        duration:
          type: integer
          minimum: 4
          maximum: 15
          default: 5
          description: '期望时长（秒）。

            允许范围：`4-15` 秒（含边界）。

            推荐值：`5`、`10`、`15`。

            '
        seconds:
          type: string
          pattern: ^(?:[4-9]|1[0-5])$
          description: 字符串形式时长（秒），允许范围：`"4"` ~ `"15"`。
        size:
          type: string
          description: 尺寸（如 `1280x720`），用于推导比例与分辨率。
        metadata:
          type: object
          additionalProperties: true
          description: 高级参数（可选）。
          properties:
            aspect_ratio:
              type: string
              enum:
              - '16:9'
              - '4:3'
              - '1:1'
              - '3:4'
              - '9:16'
              - '21:9'
              - adaptive
              description: '宽高比。

                支持：`16:9`、`4:3`、`1:1`、`3:4`、`9:16`、`21:9`、`adaptive`。

                - `adaptive`：根据输入自动选择最合适的宽高比。

                '
              example: '16:9'
            resolution:
              type: string
              enum:
              - 480p
              - 720p
              - 1080p
              description: '分辨率档位（可选）。

                **按模型区分：**

                - `ima-pro` / `seedance-2.0`：支持 `480p`、`720p`、`1080p`；实测文本生成 `1080p` 可提交并进入处理中。

                - `ima-pro-fast` / `seedance-2.0-fast`：文生视频建议使用 `480p` 或 `720p`；实测文本生成显式传 `1080p` 会被上游返回 `Invalid parameters`。

                - 若不确定，优先不传该字段或使用 `720p`。

                '
              example: 720p
            audio:
              oneOf:
              - type: boolean
              - type: string
              description: '是否生成音频。

                版权风险规避建议：

                - 若担心背景音乐版权，先设置 `audio=false`（无背景音乐）

                - 可在提示词中明确：无字幕、无背景音乐，仅保留剧情人声/环境音效/动作音效

                '
            role_mode:
              type: string
              enum:
              - reference
              - frame
              default: reference
              description: '图片角色模式。

                - `reference`（默认）：图片统一映射 `reference_image`

                - `frame`：启用首尾帧语义（单图=first_frame；双图=first_frame+last_frame）

                约束：

                - `frame` 模式仅支持 1~2 张图片

                - `frame` 模式不能与 `reference_video_urls`/`reference_audio_urls` 混用

                '
            reference_video_urls:
              type: array
              minItems: 1
              maxItems: 3
              description: "**重要：参考视频 URL 数组（最多 3 条）。请自行保证输入 URL 在提交时可访问。**\n\n传入单个参考视频要求：\n- 格式：`mp4`、`mov`\n- 分辨率：`480p`、`720p`\n- 单个视频时长：`[2,15]s`\n- 所有参考视频总时长：`<=15s`\n- 宽高比（宽/高）：`(0.4,2.5)`\n- 宽高像素（宽、高）：`(300,6000)`\n- 画面像素（宽×高）：`[409600,927408]`\n\
                \  - 例如：`640x640=409600`（最小值）\n  - 例如：`834x1112=927408`（最大值）\n- 单个视频大小：`<=50MB`\n- 帧率（FPS）：`[24,60]`\n"
              items:
                type: string
                format: uri
            reference_audio_urls:
              type: array
              minItems: 1
              maxItems: 3
              description: '**重要：参考音频 URL 数组（最多 3 条）。请自行保证输入 URL 在提交时可访问。**

                传入单个参考音频要求：

                - 格式：`wav`、`mp3`

                - 单个音频时长：`[2,15]s`

                - 所有参考音频总时长：`<=15s`

                - 单个音频大小：`<=15MB`

                - 请求体总大小：`<=64MB`

                - 大文件请勿使用 Base64 编码，建议使用可访问 URL。

                - 资源为平台短期托管内容，建议在 30 天内完成下载归档。

                '
              items:
                type: string
                format: uri
            mcp_list:
              type: array
              description: 可选 MCP 工具列表。
              items:
                type: object
                properties:
                  tool_name:
                    type: string
                    example: web_search
      anyOf:
      - description: 组合1_文本
        required:
        - prompt
      - description: 组合2_文本_图片
        required:
        - images
        properties:
          images:
            type: array
            minItems: 1
      - description: 组合3_文本_视频
        required:
        - metadata
        properties:
          metadata:
            type: object
            required:
            - reference_video_urls
            properties:
              reference_video_urls:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
                  format: uri
      - description: 组合4_文本_图片_音频
        required:
        - images
        - metadata
        properties:
          images:
            type: array
            minItems: 1
          metadata:
            type: object
            required:
            - reference_audio_urls
            properties:
              reference_audio_urls:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
                  format: uri
      - description: 组合5_文本_图片_视频
        required:
        - images
        - metadata
        properties:
          images:
            type: array
            minItems: 1
          metadata:
            type: object
            required:
            - reference_video_urls
            properties:
              reference_video_urls:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
                  format: uri
      - description: 组合6_文本_视频_音频
        required:
        - metadata
        properties:
          metadata:
            type: object
            required:
            - reference_video_urls
            - reference_audio_urls
            properties:
              reference_video_urls:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
                  format: uri
              reference_audio_urls:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
                  format: uri
      - description: 组合7_文本_图片_视频_音频
        required:
        - images
        - metadata
        properties:
          images:
            type: array
            minItems: 1
          metadata:
            type: object
            required:
            - reference_video_urls
            - reference_audio_urls
            properties:
              reference_video_urls:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
                  format: uri
              reference_audio_urls:
                type: array
                minItems: 1
                items:
                  type: string
                  format: uri
    ImaImageGenerationRequest:
      type: object
      description: "图片生成请求（按模型严格约束）。\n- `gemini-3-pro-image-preview` 与 `gemini-3.1-flash-image-preview` 的参数枚举不同\n- 二者均支持：\n  - text_to_image（仅 `prompt`）\n  - image_to_image（`image` 或 `images`）\n- image_to_image\
        \ 输入约束（上游）：\n  - 数量：`1~14`\n  - 文件类型：`jpg/png`\n- 上游参数映射约束：\n  - 请求体参数名与上游保持一致（`aspect_ratio`、`size`）\n  - 不执行 `size -> resolution` 自动转换\n  - 不注入 `duration` / `resolution`\n"
