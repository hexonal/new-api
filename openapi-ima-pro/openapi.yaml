        - 原生端点：`POST /kling/v1/videos/text2video`、`POST /kling/v1/videos/image2video`，使用 Kling 原生字段，例如 `image_tail`。\n\
        - 通用端点：`POST /v1/video/generations` / `POST /v1/videos`，使用统一视频字段，例如 `model`、`prompt`、`image`、`images`、`size`、`metadata`。\n\n\
        **支持模型：**\n\
        - `kling-v1`\n\
        - `kling-v1-6`\n\
        - `kling-v2-master`\n\
        - `kling-v2-1-master`\n\
        - `kling-v2-5-turbo`\n\
        - `kling-v2-6`\n\
        - `kling-video-o1`\n\n\
        **重要提示（必读）**\n\
        - `image`、`images`、`metadata.image_tail` 等输入 URL 是任务输入引用，请在提交时确认可访问。\n\
        - 任务完成后返回的视频 URL 为平台托管短期链接，默认约 30 天后失效；请务必在 30 天内完成下载归档。\n"
      requestBody:
        required: true
