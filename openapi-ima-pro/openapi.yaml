                    mode: std
                    cfg_scale: 0.5
              image2video:
                summary: 图生视频
                value:
                  model: kling-v1-6
                  prompt: A gentle camera pan revealing the scene
                  image: https://example.com/reference.jpg
                  duration: 5
                  size: '16:9'
                  metadata:
