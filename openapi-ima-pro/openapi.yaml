              c1_text2video:
                summary: C1 文生视频 720p/5s
                value:
                  model: pixverse-c1
                  prompt: A cat playing with a ball of yarn in a sunny room
                  duration: 5
                  quality: 720p
              v6_text2video:
                summary: V6 文生视频 1080p/8s
                value:
                  model: pixverse-v6
                  prompt: A cinematic drone shot above a quiet lake at sunrise
                  duration: 8
                  quality: 1080p
              c1_img2video:
                summary: C1 图生视频
                value:
                  model: pixverse-c1
                  prompt: A gentle breeze moving the flowers
                  duration: 5
                  quality: 720p
                  metadata:
                    img_id: 12345
              c1_text2video_with_audio:
                summary: C1 文生视频 540p/8s/带音频
                value:
                  model: pixverse-c1
                  prompt: A jazz singer performs on a rainy neon street with ambient crowd noise
                  duration: 8
                  quality: 540p
                  metadata:
                    audio: true
      responses:
