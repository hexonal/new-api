            camera_control:
              type: object
              description: 镜头控制参数。
    MiniMaxVideoGenerationRequest:
      type: object
      required:
      - model
      additionalProperties: false
      properties:
        model:
          type: string
          enum:
          - MiniMax-Hailuo-02
          - MiniMax-Hailuo-2.3
          - MiniMax-Hailuo-2.3-Fast
          description: MiniMax 视频模型（仅限 MiniMax）。
        prompt:
          type: string
          description: 视频描述
        duration:
          type: integer
          enum:
          - 6
          - 10
          default: 6
          description: 视频时长（秒），当前仅支持 6 或 10。
        size:
          type: string
          enum:
          - 512p
          - 768p
          - 1080p
          default: 768p
          description: 分辨率（按模型能力校验）。
        metadata:
          type: object
          description: 'MiniMax 供应商参数。

            - 图生视频：`{"first_frame_image":"URL"}`

            '
          properties:
            first_frame_image:
              type: string
              description: Hailuo 图生视频首帧图片 URL（`MiniMax-Hailuo-2.3-Fast` 必填）。请自行保证输入 URL 在提交时可访问。
      allOf:
      - if:
          properties:
            model:
              const: MiniMax-Hailuo-2.3-Fast
        then:
          required:
          - metadata
          properties:
            size:
              type: string
              enum:
              - 768p
              - 1080p
            metadata:
              type: object
              required:
              - first_frame_image
      - if:
          properties:
            model:
              const: MiniMax-Hailuo-2.3-Fast
            size:
              const: 1080p
        then:
          properties:
            duration:
              type: integer
              enum:
              - 6
      - if:
          properties:
            model:
              const: MiniMax-Hailuo-2.3
        then:
          properties:
            size:
              type: string
              enum:
              - 768p
              - 1080p
      - if:
          properties:
            model:
              const: MiniMax-Hailuo-2.3
            size:
              const: 1080p
        then:
          properties:
            duration:
              type: integer
              enum:
              - 6
      - if:
          properties:
            model:
              const: MiniMax-Hailuo-02
        then:
          properties:
            size:
              type: string
              enum:
              - 512p
              - 768p
              - 1080p
      - if:
          properties:
            model:
              const: MiniMax-Hailuo-02
            size:
              const: 1080p
        then:
          properties:
            duration:
              type: integer
              enum:
              - 6
    VideoTaskResponse:
