  /kling/v1/videos/text2video:
    post:
      tags:
      - Kling 视频
      summary: 提交 Kling 文生视频任务
      operationId: klingText2Video
      description: "Kling 文生视频原生端点（异步任务制）。本文档仅描述 `POST /kling/v1/videos/text2video` 的请求格式。\n\n\
        提交后返回 `task_id`，可通过 `GET /kling/v1/videos/text2video/{task_id}` 查询；任务查询也兼容 `GET /v1/video/generations/{task_id}` 与 `GET /v1/videos/{task_id}`。\n\n\
        如需使用 `POST /v1/video/generations` 或 `POST /v1/videos` 提交任务，请查看对应端点文档；它们使用统一视频/OpenAI 兼容请求格式，不与 Kling 原生端点完全相同。\n\n\
        **支持模型：**\n\
        - `kling-v1`\n\
        - `kling-v1-6`\n\
        - `kling-v2-master`（大师版，无 std/pro 区分）\n\
        - `kling-v2-1-master`（大师版，无 std/pro 区分）\n\
        - `kling-v2-5-turbo`\n\
        - `kling-v2-6`\n\
        - `kling-video-o1`\n\n\
        **参数说明：**\n\
        - `mode`：品质，`std`（标准，默认）或 `pro`（高品质）。大师版模型无此参数。\n\
        - `duration`：时长（秒），默认 5，支持 5 或 10。\n\
        - `aspect_ratio`：宽高比，`1:1`（默认）、`16:9`、`9:16`。也可通过 `size` 传尺寸自动映射。\n\
        - `cfg_scale`：生成自由度，0~1，默认 0.5。\n\
        - `negative_prompt`：反向提示词（可选）。\n\
        - `camera_control`：镜头控制（可选，通过 metadata 传递）。\n\
        - `model`：Kling 视频模型名称。\n\n\
        **重要提示（必读）**\n\
        - 任务完成后返回的视频 URL 为平台托管短期链接，建议接收后立即下载并持久化。\n\
        - 平台托管资源默认约 30 天后失效，请务必在 30 天内完成下载归档。\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KlingText2VideoRequest'
            examples:
              text2video_std_5s:
                summary: 文生视频 std 5s
                value:
                  model: kling-v1-6
                  prompt: A cat playing with a ball of yarn in a sunny room
                  mode: std
                  duration: 5
                  aspect_ratio: '16:9'
              text2video_pro_10s:
                summary: 文生视频 pro 10s
                value:
                  model: kling-v2-5-turbo
                  prompt: A cinematic drone shot above a quiet lake at sunrise
                  mode: pro
                  duration: 10
                  aspect_ratio: '16:9'
              text2video_master:
                summary: 文生视频（大师版）
                value:
                  model: kling-v2-master
                  prompt: Hyper-realistic close-up of a dewdrop on a leaf
                  duration: 5
                  aspect_ratio: '1:1'
      responses:
        '200':
          description: 任务提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTaskResponse'
        '401':
          description: 鉴权失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-apifox-folder: Kling 视频
      x-apifox-status: released
