        若需完整图集，请优先读取 `/mj/task/{task_id}/fetch` 的 `urls`。

        **严重告知（必读）**

        - 代理图片仍来自查询结果资源，请立即下载并自行持久化保存。

        - 平台不保证代理图片 URL 长期可访问，默认约 30 天后失效；不要把该 URL 当作永久存储地址。

