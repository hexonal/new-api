      summary: 提交 PixVerse 视频任务
      operationId: createPixVerseVideoTask
      description: "PixVerse 视频生成端点（异步任务制）。提交后返回 `task_id`，通过 `GET /v1/video/generations/{task_id}` 轮询结果。\n\n\
        **可用端点（二选一，参数格式相同）：**\n\
        | 端点 | 说明 |\n\
        |------|------|\n\
        | `POST /v1/video/generations` | 通用视频端点 |\n\
        | `POST /v1/videos` | OpenAI 兼容端点 |\n\n\
        **支持模型：**\n\
        - `pixverse-c1`（最新，按秒计费，支持 360p~1080p）\n\
        - `pixverse-v6`（最新，按秒计费，支持 360p~1080p）\n\n\
        **参数说明：**\n\
        - `prompt`：必填，视频描述。\n\
        - `duration`：时长（秒），默认 5。\n\
        - `quality`：分辨率，`720p`（默认）。C1/V6 支持 `360p`、`540p`、`720p`、`1080p`。\n\
        - `size`：宽高比，如 `16:9`（默认）、`9:16`、`1:1`。\n\
        - `metadata.audio`：是否启用音频；对外字段，服务端会映射到 PixVerse 官方音频参数。\n\
        - `metadata.img_id`：图生视频时传已上传的图片 ID。\n\
        - `metadata.negative_prompt`：反向提示词（可选）。\n\n\
        **计费说明：**\n\
        - `pixverse-c1` / `pixverse-v6` 在官方 PixVerse 渠道按 `duration + quality + audio` 动态计费。\n\
        - 非官方/代理 PixVerse 渠道仍可能按固定价结算，具体以渠道配置为准。\n\n\
        **重要提示（必读）**\n\
        - 图生视频使用的输入素材请在调用前确认已持久化；任务完成后返回的视频 URL 为平台托管短期链接。\n\
        - 平台托管资源默认约 30 天后失效，请务必在 30 天内完成下载归档。\n"
