<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usage Logs Responsive Harness</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at top left, #eef4ff 0, #f8faff 38%, #f4f6fb 100%);
        color: #16315c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: #4e678f;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 20px;
      }

      .card {
        border: 1px solid #c9d9f2;
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 16px 32px rgba(39, 76, 140, 0.08);
        backdrop-filter: blur(6px);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #dbe7fb;
        background: rgba(245, 249, 255, 0.88);
        font-weight: 600;
      }

      .label {
        font-size: 14px;
      }

      .meta {
        font-size: 12px;
        color: #54709f;
      }

      iframe {
        display: block;
        width: 100%;
        border: 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <h1>Usage Logs Responsive Harness</h1>
    <p>当前 BrowserOS 登录态下的响应式观察页，用于并排检查不同宽度的真实布局。</p>
    <div class="grid">
      <section class="card">
        <div class="header">
          <span class="label">Mobile</span>
          <span class="meta">390px</span>
        </div>
        <iframe src="http://127.0.0.1:4000/console/log" style="height: 1300px; width: 390px"></iframe>
      </section>
      <section class="card">
        <div class="header">
          <span class="label">Tablet</span>
          <span class="meta">820px</span>
        </div>
        <iframe src="http://127.0.0.1:4000/console/log" style="height: 1300px; width: 820px"></iframe>
      </section>
      <section class="card">
        <div class="header">
          <span class="label">Desktop</span>
          <span class="meta">1280px</span>
        </div>
        <iframe src="http://127.0.0.1:4000/console/log" style="height: 1300px; width: 1280px"></iframe>
      </section>
    </div>
  </body>
</html>
